# Site parameters — copy to site/site.yaml and fill in with YOUR values.
#
# This is the ONLY thing carried over from a previous deployment: the facts
# about the radio, the cell and the core. Never the old config files, never the
# old build, never the old container. Fresh configs are rendered from the
# pristine upstream templates in stack/ plus the numbers below.
#
# site/ is untracked. The values here are placeholders, not a real deployment.

ru:
  vendor: benetel
  model: RAN550              # O-RAN 7.2a indoor RU, n78/n79, 4T4R
  # Destination MAC of the RU on the fronthaul (cuphycontroller dst_mac_addr).
  mac: "00:00:00:00:00:00"
  vlan: 0
  pcp: 0                     # priority code point for eCPRI frames
  # eAxC (extended antenna-carrier) IDs, per O-RAN 7.2. These MUST match how the
  # RU is provisioned -- read them off the RU itself, do not copy them from
  # another deployment's config. A vendor's PRACH ports in particular are often
  # NOT 4-7: a Benetel RANx50 carries PRACH on ru-port 8-11 and its user guide
  # says in as many words that the O-DU must be set to match.
  #
  # A PRACH mismatch does not announce itself. The DU listens on ports the RU
  # never sends on, cuPHY correlates empty buffers, and preambles get "detected"
  # in thermal noise -- dozens of random preamble indices per second, filling
  # the RA process table and locking the real UE out. Meanwhile the RU's actual
  # PRACH lands on whatever the DU has assigned to srs, which then processes
  # PRACH as SRS and can stall the whole uplink slot.
  eaxc:
    ssb_pbch: [0, 1, 2, 3]
    pdcch:    [0, 1, 2, 3]
    pdsch:    [0, 1, 2, 3]
    csirs:    [0, 1, 2, 3]
    pusch:    [0, 1, 2, 3]
    pucch:    [0, 1, 2, 3]
    prach:    [4, 5, 6, 7]
    srs:      [8, 9, 10, 11]
  # O-RAN fronthaul timing windows, in nanoseconds. THE most RU-specific values
  # in the whole stack: they define when the RU expects C-plane and U-plane
  # messages. Take them from the RU vendor's "O-DU delay profile" table -- every
  # vendor publishes one, and it varies by firmware version AND by which DU you
  # are driving it with (Benetel, for instance, tabulates a different T1a_cp_ul
  # for FlexRAN-style and srsRAN-style DUs; Aerial follows the FlexRAN column).
  #
  # Leave a value at 0 and the renderer keeps whatever the upstream template
  # carries -- which is usually correct, because NVIDIA's templates ship real
  # profiles. Overriding them with numbers harvested from an older deployment is
  # how a DU ends up transmitting outside the window the RU accepts.
  timing:
    T1a_max_cp_ul_ns: 0
    T1a_min_cp_ul_ns: 0
    T1a_max_cp_dl_ns: 0
    T1a_min_cp_dl_ns: 0
    T1a_max_up_ns:    0
    Ta4_min_ns:       0
    Ta4_max_ns:       0
    Tcp_adv_dl_ns:    0
    ul_u_plane_tx_offset_ns: 0

fronthaul:
  nic_pcie: "0000:00:00.0"   # PCIe address cuphycontroller binds via DPDK
  mtu: 8192                  # jumbo frames are mandatory

cell:
  band: 78
  prb: 273                   # 273 PRB = 100 MHz at 30 kHz SCS
  scs: 1                     # 0=15kHz 1=30kHz 2=60kHz 3=120kHz
  absolute_frequency_ssb: 0
  absolute_frequency_point_a: 0
  phys_cell_id: 0
  nr_cellid: 0
  pdsch_antenna_ports_xp: 2
  pdsch_antenna_ports_n1: 2
  pusch_antenna_ports: 4
  prach_configuration_index: 0
  # RACH detection and power ramping. These belong to the RU + RF environment,
  # not to OAI's template: the wrong ones show up as cuPHY detecting preambles
  # in thermal noise ("no free RA process" for random preamble indices) and a
  # UE that attaches, fails PUSCH, and re-establishes in a loop.
  rach:
    zero_correlation_zone_config: 0
    preamble_received_target_power: -100
    preamble_trans_max: 8
    power_ramping_step: 3      # 0=dB0 1=dB2 2=dB4 3=dB6
    msg3_delta_preamble: 2
  # UL power control. p0_* too high makes the UE undershoot the target SNR.
  power:
    p_max: 23
    p0_nominal: -96
    p0_nominal_with_grant: -96
  # TDD pattern — must match how the RU is provisioned.
  tdd:
    periodicity: 6           # 6 = 5 ms
    dl_slots: 7
    dl_symbols: 6
    ul_slots: 2
    ul_symbols: 4

# MAC scheduler. pusch_failure_thres is the one that bites: OAI defaults to 10,
# so ten missed PUSCH transmissions declare the UE failed and stop scheduling
# it -- during bring-up that tears the connection down before you can look at
# it. Real deployments run it far higher.
mac:
  pusch_failure_thres: 1000
  pusch_target_snr_x10: 180
  pucch_target_snr_x10: 220
  ul_max_mcs: 28

plmn:
  mcc: "001"
  mnc: "01"
  mnc_length: 2
  tac: 1
  sst: 1

gnb:
  id: "0xe00"
  name: "gNB-OAI"

core:
  # The core is external: this repo deploys a CU and a DU, not a 5G core. Point
  # these at an AMF that is already running and reachable from this host.
  # Only the CU uses them -- a DU never speaks NGAP.
  amf_ip: "0.0.0.0"          # AMF the CU registers with (N2/SCTP 38412)
  gnb_n2_ip: "0.0.0.0"       # this host's address for N2 and N3

# F1: the CU/DU split. Both run on the host's network namespace, so these are
# loopback addresses on the same box -- distinct ones, because OAI binds them
# and two processes cannot share 127.0.0.1 on the same port.
#
# 127.0.0.1 and .2 are already taken: the L2 reaches Aerial's L1 over nvIPC
# using those as its "pnf"/"vnf" addresses. Start F1 at .3.
split:
  cu_f1_address: "127.0.0.3"
  du_f1_address: "127.0.0.4"
  f1c_port: 38472            # F1-C, SCTP
  f1u_port: 2152             # F1-U, GTP-U

# Absolute CPU core ids. Aerial pins threads to these numbers directly, so they
# must sit inside the kernel's isolcpus range and must not overlap.
cpu:
  aerial_workers_ul: [5, 6]
  aerial_workers_dl: [7, 8, 9]
  aerial_low_priority: 10
  aerial_h2d_copy: 11
  data_core: 12              # E3 agent / Aerial Data Lake
  l2_timer_thread: 15
  l2_message_thread: 16
  oai_gnb: "17-19"
  oai_poll_core: 19

# Global cuPHY tuning, from the L1 config that works with YOUR RU.
# These are not cosmetic: prach_aggr_per_ctx too low makes
# cuphyValidatePrachParams reject the cell with "pOccaPrms is null".
aerial:
  mps_sm_ul_order: 20
  pusch_aggr_per_ctx: 6
  prach_aggr_per_ctx: 4
  pucch_aggr_per_ctx: 4
  srs_aggr_per_ctx: 3
  # l2_adapter_config tick source. MUST stay 1 (sleep) on Aerial 26.1: mode 0
  # (poll) ticks arrive slightly early, and a signed/unsigned comparison bug in
  # nv_phy_module treats every early tick as a late slot -- the cell starts but
  # never transmits a single slot. (Reference config sets carrying 0 predate
  # this; do not copy them.)
  tick_generator_mode: 1

dapp:
  enabled: true              # sets data_core + e3_agent_enable in the L1 config
  variant: python            # python | triton | triton-grpc
