# One DU = one cell site = one Helm release. See templates/deployment.yaml for
# why this is a single Pod and why there are no CPU limits.
#
# Site-specific values (RU MAC, VLAN, cell identity) do NOT belong here --
# they live in the cuphycontroller YAML inside the cuBB tree and in the gNB
# config. Point this chart at them; do not copy them into a tracked file.

nameOverride: ""

# Set by 34-deploy-du.sh to the hash of the rendered configs, so that a
# changed config actually restarts the pod. See templates/deployment.yaml.
configHash: ""

l1:
  image:
    repository: nvcr.io/nvidia/aerial/aerial-cuda-accelerated-ran
    tag: 26-1-cubb
    pullPolicy: IfNotPresent
  # Argument to run_l1.sh; selects cuphycontroller_<profile>.yaml.
  # run_l1.sh also auto-detects this from DMI, but be explicit.
  configProfile: P5G_WNC_DGX
  # Host path of the BUILT cuBB tree, mounted at /opt/nvidia/cuBB.
  # It must contain the compiled binary that run_l1.sh looks for:
  #   build.$(uname -m)/cuPHY-CP/cuphycontroller/examples/cuphycontroller_scf
  # (or build/... ). A source-only checkout will not start.
  cubbHostPath: /opt/aerial/cuBB
  logHostPath: /var/log/aerial
  # OAI's cmake_targets/share, mounted at /opt/cuBB/share. The reference
  # docker-compose mounts this and it is easy to miss: cuPHY reads data from
  # here, and without it cell configuration can fail in ways that look like
  # bad PRACH parameters rather than a missing mount. Set to the OAI source
  # tree's cmake_targets/share; empty to skip.
  sharePath: ""
  # Required: Kubernetes rejects a hugepages request that has no cpu or memory
  # beside it. A request, not a limit -- see the note in the template.
  memoryRequest: 8Gi
  # Ask the scheduler for nvidia.com/gpu, which requires the NVIDIA device
  # plugin to be advertising it.
  #
  # Off by default because the plugin CANNOT run on a unified-memory part such
  # as GB10: it builds its device map by querying per-device memory, and NVML
  # answers "Not Supported" there, so the DaemonSet crash-loops and the node
  # never advertises a GPU. It is also unnecessary here -- with nvidia as
  # Docker's default runtime the GPU is injected into the container anyway, and
  # a plugin exists to ration GPUs between competing pods, which a single-GPU
  # node running one DU does not need. Turn on for a discrete-GPU host where
  # several workloads compete.
  requestGpu: false
  # What the nvidia runtime injects into the L1 container. "all" on a host
  # with one plain GPU. On a MIG-enabled GPU (GH200/H100) "all" is NOT enough:
  # name the MIG device the L1 owns, as "MIG-<uuid>" from `nvidia-smi -L` or
  # as "<gpu index>:<gi index>" (e.g. "0:1"). cuPHY then partitions that
  # slice's SMs through MPS exactly as it would a whole GPU.
  visibleDevices: "all"

l2:
  image:
    repository: oai-gnb-aerial
    tag: latest
    pullPolicy: IfNotPresent
  additionalOptions: "--log_config.global_log_options level,nocolor,utc_time"
  # Leave false on a single-GPU node: GPU requests sum across a Pod's
  # containers, so true here would demand two GPUs and never schedule.
  # The L2 links nvIPC with CUDA disabled and does not need the device.
  requestGpu: false
  # gNB config file: provide via ConfigMap generated from site/, or set
  # hostPath to mount it directly from disk.
  configHostPath: ""          # e.g. /opt/aerial/gnb.conf
  configMap: ""               # name of a ConfigMap with key gnb.conf

# The fronthaul, N2 and N3 all ride host interfaces, and cuphycontroller binds
# the NIC by PCIe address through DPDK. Host networking is not optional here.
hostNetwork: true

# Matches shm_size: 4096m in the reference compose. This is where nvIPC puts
# the FAPI ring buffers shared between L1 and L2.
shmSize: 4Gi

hugepages:
  enabled: true
  size: 1Gi
  amount: 8Gi

# Pin the DU to the node that has the GPU and the fronthaul cable.
nodeSelector: {}
tolerations: []
