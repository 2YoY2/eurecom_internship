# DU-High: OAI MAC/RLC (the L2). Runs on a DIFFERENT machine from the DU-Low.
#
# It reaches the L1 over SCF FAPI carried on nvIPC's DPDK transport, across the
# network, instead of through /dev/shm on the same host. That is the whole point
# of the split, and it is why this is a separate Deployment with its own node
# selector rather than a sidecar in the DU-Low pod.
#
# PREREQUISITE, and it is not satisfied by this file: the DU-High host must be a
# node in the cluster and carry the labels below. It is a separate machine from
# the GPU host and joining it is an infrastructure change, so this manifest is
# written and deliberately not applied.
#
# Ordering matters at runtime: the L1 must be listening before this starts. Its
# connect handshake is single-shot, so after a completed or failed attempt the
# DU-Low must be restarted before retrying. See fapi-over-dpdk/RESUME.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-du-high
  labels:
    app.kubernetes.io/name: oai-du-high
    app.kubernetes.io/component: du-high
spec:
  replicas: 1
  # Recreate: two DU-Highs cannot hold the VF or the GTP-U port at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oai-du-high
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oai-du-high
    spec:
      # The SR-IOV VF and its IOMMU group belong to one specific machine, so the
      # architecture alone is not enough to pin this.
      nodeSelector:
        kubernetes.io/arch: amd64
        yoy.ran/role: du-high
      hostNetwork: true          # F1-C/F1-U, E2 and GTP-U bind the host address
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      volumes:
        # Docker's --shm-size=4g has no direct equivalent: a Memory-medium
        # emptyDir mounted at /dev/shm is it. The default 64 MB is NOT enough --
        # nvIPC keeps shared-memory rings even on the DPDK transport, and one of
        # its pools is far larger, so the mapping succeeds sparsely and the first
        # touch takes SIGBUS inside array_queue_open().
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
        - name: hugepage
          emptyDir: { medium: HugePages }
        # VFIO passthrough for the SR-IOV VF. Kubernetes has no --device, so the
        # device nodes come in as a hostPath. The cleaner answer is the SR-IOV
        # network device plugin, which would advertise the VF as a schedulable
        # resource instead; that is a cluster addition, not a manifest change.
        - name: vfio
          hostPath: { path: /dev/vfio, type: Directory }
        - name: du-conf
          configMap: { name: oai-du-high-conf }
      containers:
        - name: oai-du-high
          image: IMAGE_DU_HIGH
          imagePullPolicy: IfNotPresent
          # privileged, not a capability set -- and the reason is specific to
          # Kubernetes. Under Docker this container runs unprivileged with just
          # SYS_NICE/IPC_LOCK/NET_ADMIN/SYS_RAWIO, because `docker --device`
          # both exposes the device node AND adds a device-cgroup allow rule.
          # A hostPath mount only does the first, so DPDK gets
          #   "Cannot open VFIO container /dev/vfio/vfio (Operation not permitted)"
          # and falls back to no VFIO at all.
          #
          # The correct fix is the SR-IOV network device plugin, which advertises
          # the VF as a schedulable resource and sets the cgroup rule itself. That
          # is a cluster addition; until it is deployed, privileged is what works.
          securityContext:
            privileged: true
          # stdbuf, not bare exec: the process's stdout is a pipe to the log
          # collector and therefore block-buffered, which silently loses the last
          # few KB before a crash and makes the process look like it died earlier
          # than it did.
          command: [stdbuf, -oL, -eL, /opt/oai-du/bin/nr-softmodem]
          args: ["-O", "/opt/oai-du/etc/gnb.conf"]
          env:
            - { name: NVIPC_CONFIG_FILE, value: /opt/oai-du/etc/nvipc.yaml }
            # E2SM-AYYUR bridge. The E2 agent lives here, but the Ayyur dApp is
            # co-located with the L1 on the DU-Low host -- E3 gives it the CSI
            # through shared memory, which does not cross machines. So the agent
            # connects out to the dApp instead of the localhost default.
            #   :6001 REQ/REP  RIC -> dApp   (enroll / release)
            #   :6002 SUB      dApp -> RIC   (latent reports)
            - { name: AYYUR_DAPP_CTRL_EP,   value: "tcp://DU_LOW_HOST:6001" }
            - { name: AYYUR_DAPP_LATENT_EP, value: "tcp://DU_LOW_HOST:6002" }
          volumeMounts:
            - { name: dshm,     mountPath: /dev/shm }
            - { name: hugepage, mountPath: /dev/hugepages }
            - { name: vfio,     mountPath: /dev/vfio }
            - name: du-conf
              mountPath: /opt/oai-du/etc/gnb.conf
              subPath: gnb.conf
            - name: du-conf
              mountPath: /opt/oai-du/etc/nvipc.yaml
              subPath: nvipc.yaml
          resources:
            # Integer CPU with equal requests and limits puts the pod in
            # Guaranteed QoS, which is what lets the kubelet's static CPU manager
            # policy give it exclusive cores. Without that policy enabled on the
            # node the cores are shared and the slot budget suffers.
            requests: { cpu: 8, memory: 4Gi, hugepages-1Gi: 4Gi }
            limits:   { cpu: 8, memory: 4Gi, hugepages-1Gi: 4Gi }
          livenessProbe:
            exec:
              command: [bash, -c, "pgrep -x nr-softmodem >/dev/null"]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
